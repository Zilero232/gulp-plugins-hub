name: Setup toolchain
description: Bun and Node from mise.toml, cached bun packages and turbo outputs, and installed dependencies.

inputs:
  node-version:
    description: Overrides the Node version from mise.toml (the test matrix uses it).
    required: false
  cache:
    description: Use the tool and package caches. The release job turns them off, so a poisoned cache cannot reach it.
    default: 'true'

runs:
  using: composite

  steps:
    - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      env:
        MISE_NODE_VERSION: ${{ inputs.node-version }}
      with:
        install: true
        cache: ${{ inputs.cache }}
        # One cache per OS and Node version, so the matrix jobs do not share and re-download one entry.
        cache_key_prefix: mise-${{ runner.os }}-node-${{ inputs.node-version || 'default' }}

    - name: Cache bun packages
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

    # turbo's local cache: unchanged packages replay their typecheck, test and build results. One entry per commit,
    # job, OS and Node version; a new commit starts from the latest entry of the same job.
    - name: Cache turbo outputs
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-node-${{ inputs.node-version || 'default' }}-${{ github.job }}-${{ github.sha }}
        restore-keys: turbo-${{ runner.os }}-node-${{ inputs.node-version || 'default' }}-${{ github.job }}-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
